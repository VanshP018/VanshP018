<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" shape-rendering="crispEdges">
  <defs>
    <filter id="pixel-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ULTRA-CUTE SUPER-DEFORMED (SD) MONK MASCOT (CONNECTED HEAD &amp; 2 CLEAR EYES) -->
  <g filter="url(#pixel-shadow)">
    <!-- HUGE BALD DOME HEAD &amp; FOREHEAD -->
    <rect x="10" y="0" width="12" height="1" fill="#fed7aa"/>
    <rect x="8" y="1" width="16" height="3" fill="#fed7aa"/>
    <rect x="6" y="4" width="20" height="12" fill="#fdba74"/>
    <rect x="5" y="10" width="22" height="7" fill="#fdba74"/>

    <!-- Shiny Forehead Highlight -->
    <rect x="12" y="1" width="5" height="1" fill="#fff7ed"/>
    <rect x="11" y="2" width="4" height="2" fill="#fff7ed"/>
    <rect x="10" y="4" width="2" height="2" fill="#fff7ed"/>

    <!-- Ears -->
    <rect x="4" y="9" width="2" height="4" fill="#fdba74"/>
    <rect x="26" y="9" width="2" height="4" fill="#fdba74"/>

    <!-- 2 SEPARATE EXPRESSIVE CURVED EYEBROWS -->
    <rect x="10" y="7" width="5" height="2" fill="#0f172a"/>
    <rect x="17" y="7" width="6" height="2" fill="#0f172a"/>

    <!-- 2 CLEAR DISTINCT EYES (LEFT &amp; RIGHT) WITH SPARKLES -->
    <!-- Left Eye -->
    <rect x="11" y="10" width="3" height="3" fill="#0f172a"/>
    <rect x="12" y="10" width="1" height="1" fill="#fff7ed"/>

    <!-- Right Eye -->
    <rect x="18" y="10" width="4" height="3" fill="#0f172a"/>
    <rect x="19" y="10" width="1" height="1" fill="#fff7ed"/>

    <!-- Cute Rosy Cheeks -->
    <rect x="7" y="13" width="3" height="2" fill="#fb7185"/>
    <rect x="22" y="13" width="3" height="2" fill="#fb7185"/>

    <!-- Cute Smile -->
    <rect x="15" y="14" width="3" height="2" fill="#e11d48"/>

    <!-- CONNECTED NECK &amp; CHUBBY ROBE (HEAD ATTACHED DIRECTLY TO SHOULDERS) -->
    <rect x="12" y="16" width="8" height="3" fill="#fdba74"/> <!-- Neck connector -->
    
    <rect x="7" y="18" width="18" height="6" fill="#eab308"/>
    <rect x="9" y="18" width="14" height="2" fill="#fde047"/>
    <path d="M11,18 L16,21 L11,24" stroke="#ca8a04" stroke-width="1.5" fill="none"/>

    <!-- Purple Belt -->
    <rect x="7" y="24" width="18" height="2" fill="#581c87"/>

    <!-- Flowing Sleeves &amp; Arms -->
    <g>
      <rect x="4" y="19" width="4" height="3" fill="#ca8a04"/>
      <rect x="2" y="21" width="3" height="3" fill="#fed7aa"/>

      <rect x="18" y="18" width="5" height="4" fill="#eab308"/>
      <rect x="22" y="20" width="4" height="4" fill="#fed7aa"/>
    </g>

    <!-- Chubby Pants &amp; Short Boots -->
    <rect x="8" y="26" width="16" height="2" fill="#c2410c"/>

    <g>
      <!-- Back Leg -->
      <rect x="6" y="28" width="5" height="2" fill="#fef3c7"/>
      <rect x="4" y="29" width="6" height="2" fill="#78350f"/>
      <rect x="3" y="31" width="7" height="1" fill="#451a03"/>

      <!-- Front Leg -->
      <rect x="17" y="28" width="5" height="2" fill="#fef3c7"/>
      <rect x="17" y="29" width="7" height="2" fill="#78350f"/>
      <rect x="17" y="31" width="8" height="1" fill="#451a03"/>
    </g>
  </g>
</svg>
