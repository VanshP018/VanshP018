    <!-- Pipe Rim Top -->
    <rect x="0" y="0" width="32" height="10" fill="#0f172a"/>
    <rect x="1" y="1" width="30" height="8" fill="#16a34a"/>
    <rect x="3" y="1" width="4" height="8" fill="#86efac"/>
    <rect x="23" y="1" width="5" height="8" fill="#15803d"/>

    <!-- Pipe Body Base -->
