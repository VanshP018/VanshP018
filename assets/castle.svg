<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="320" height="360" shape-rendering="crispEdges">
  <defs>
    <style>
      .princess-wave { animation: animPrincessWave 0.5s ease-in-out infinite; }
      .heart-float   { animation: animHearts 1.5s ease-in-out infinite; }

      @keyframes animPrincessWave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-30deg); }
      }
      @keyframes animHearts {
        0% { opacity: 0.4; transform: translateY(0px); }
        50% { opacity: 1; transform: translateY(-8px); }
        100% { opacity: 0.4; transform: translateY(0px); }
      }
    </style>
  </defs>

  <!-- PEACH'S CASTLE BASE &amp; STRUCTURE -->
  <g id="castle-structure">
    <!-- Outer Stone Wall Base -->
    <rect x="10" y="110" width="140" height="66" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
    <path d="M10,130 H150 M10,150 H150" stroke="#d97706" stroke-width="1.5"/>

    <!-- Left Lower Turret -->
    <path d="M10,110 L25,65 L40,110 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <path d="M15,95 Q25,85 35,95" stroke="#b91c1c" stroke-width="1.5" fill="none"/>
    <rect x="15" y="110" width="20" height="66" fill="#fde047" stroke="#78350f" stroke-width="1.5"/>
    <polygon points="25,65 38,58 25,51" fill="#fbbf24"/>
    <line x1="25" y1="65" x2="25" y2="48" stroke="#78350f" stroke-width="1.5"/>

    <!-- Right Lower Turret -->
    <path d="M120,110 L135,65 L150,110 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <path d="M125,95 Q135,85 145,95" stroke="#b91c1c" stroke-width="1.5" fill="none"/>
    <rect x="125" y="110" width="20" height="66" fill="#fde047" stroke="#78350f" stroke-width="1.5"/>
    <polygon points="135,65 148,58 135,51" fill="#fbbf24"/>
    <line x1="135" y1="65" x2="135" y2="48" stroke="#78350f" stroke-width="1.5"/>

    <!-- Center Main Tower -->
    <rect x="45" y="55" width="70" height="121" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
    <rect x="40" y="50" width="80" height="8" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>

    <!-- Main Grand Red Cone Roof -->
    <path d="M35,50 L80,0 L125,50 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <path d="M50,35 Q80,20 110,35 M60,20 Q80,10 100,20" stroke="#b91c1c" stroke-width="2" fill="none"/>

    <!-- Main Golden Flag on Top -->
    <polygon points="80,0 96,-8 80,-16" fill="#fbbf24"/>
    <line x1="80" y1="0" x2="80" y2="-20" stroke="#78350f" stroke-width="2"/>

    <!-- Upper Arched Stained Glass Window -->
    <path d="M70,75 A10,10 0 0,1 90,75 V90 H70 Z" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
    <line x1="80" y1="65" x2="80" y2="90" stroke="#78350f" stroke-width="1"/>
    <line x1="70" y1="80" x2="90" y2="80" stroke="#78350f" stroke-width="1"/>

    <!-- Grand Arched Entrance Doorway -->
    <path d="M58,176 A22,22 0 0,1 102,176 Z" fill="#2d0f02" stroke="#78350f" stroke-width="2"/>
    <path d="M54,176 A26,26 0 0,1 106,176" fill="none" stroke="#d97706" stroke-width="3"/>
    <path d="M60,176 A20,20 0 0,1 100,176 Z" fill="#0f172a"/>
  </g>

  <!-- DETAILED &amp; ULTRA-CUTE PRINCESS PEACH SPRITE WITH 3 FLOATING HEARTS -->
  <g id="princess-peach-character" transform="translate(64, 138)">
    <!-- 3 FLOATING HEART PARTICLES -->
    <g class="heart-float">
      <path d="M-8,-8 Q-6,-12 -4,-8 Q-2,-12 0,-8 Q0,-4 -4,0 Q-8,-4 -8,-8 Z" fill="#f43f5e"/>
      <path d="M6,-18 Q8,-22 10,-18 Q12,-22 14,-18 Q14,-14 10,-10 Q6,-14 6,-18 Z" fill="#e11d48"/>
      <path d="M16,-10 Q18,-14 20,-10 Q22,-14 24,-10 Q24,-6 20,-2 Q16,-6 16,-10 Z" fill="#ec4899"/>
    </g>

    <!-- Flowing Auburn Red Hair (Back) -->
    <path d="M4,4 C0,12 2,24 6,30 L26,30 C30,24 32,12 28,4 Z" fill="#b91c1c"/>
    <path d="M6,6 C2,14 4,22 8,28 L24,28 C28,22 30,14 26,6 Z" fill="#dc2626"/>

    <!-- Detailed Jeweled Golden Crown -->
    <path d="M8,1 L10,-4 L13,-1 L16,-5 L19,-1 L22,-4 L24,1 Z" fill="#facc15" stroke="#78350f" stroke-width="0.8"/>
    <circle cx="16" cy="-2" r="1.2" fill="#ef4444"/> <!-- Ruby Gem -->
    <circle cx="11" cy="-1" r="0.8" fill="#38bdf8"/> <!-- Sapphire Gem -->
    <circle cx="21" cy="-1" r="0.8" fill="#38bdf8"/>

    <!-- Cute Face (Looking at Viewer) -->
    <rect x="8" y="3" width="16" height="11" fill="#fdba74"/>

    <!-- Rosy Cheeks -->
    <rect x="7" y="10" width="4" height="3" fill="#fb7185"/>
    <rect x="21" y="10" width="4" height="3" fill="#fb7185"/>

    <!-- Expressive Eyes with Sparkles -->
    <rect x="10" y="6" width="3" height="4" fill="#0f172a"/>
    <rect x="11" y="6" width="1" height="1" fill="#ffffff"/>

    <rect x="19" y="6" width="3" height="4" fill="#0f172a"/>
    <rect x="20" y="6" width="1" height="1" fill="#ffffff"/>

    <!-- Adorable Smile -->
    <path d="M13,11 Q16,14 19,11" stroke="#e11d48" stroke-width="1.2" fill="none"/>

    <!-- Royal White Gown with Red Ribbon &amp; Puffed Sleeves -->
    <path d="M6,14 Q16,13 26,14 L30,34 L2,34 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Red Waist Ribbon &amp; Bow -->
    <rect x="7" y="22" width="18" height="3" fill="#dc2626"/>
    <circle cx="16" cy="23.5" r="2" fill="#b91c1c"/>

    <!-- Gown Hem Accent Stripe -->
    <path d="M3,31 Q16,33 29,31 V34 H3 Z" fill="#dc2626"/>

    <!-- Left Resting Arm -->
    <circle cx="5" cy="16" r="3" fill="#ffffff"/> <!-- Puffed Sleeve -->
    <rect x="4" y="18" width="3" height="6" fill="#fdba74"/>

    <!-- Waving Right Arm -->
    <circle cx="27" cy="16" r="3" fill="#ffffff"/> <!-- Puffed Sleeve -->
    <g transform="translate(26, 17)">
      <g class="princess-wave" transform-origin="0 0">
        <rect x="0" y="-8" width="4" height="10" fill="#fdba74"/>
        <circle cx="2" cy="-9" r="2.5" fill="#fdba74"/>
      </g>
    </g>
  </g>
</svg>
