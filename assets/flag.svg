<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="64" height="128" shape-rendering="crispEdges">
  <!-- 16-Bit Tech Flag & Flagpole -->
  <g>
    <!-- Flagpole Base -->
    <rect x="12" y="58" width="8" height="6" fill="#0f172a"/>
    <rect x="14" y="56" width="4" height="4" fill="#334155"/>

    <!-- Flagpole Ball Top (Glowing Node) -->
    <rect x="13" y="0" width="6" height="6" fill="#38bdf8"/>
    <rect x="14" y="1" width="4" height="4" fill="#7dd3fc"/>

    <!-- Pole -->
    <rect x="15" y="6" width="2" height="52" fill="#94a3b8"/>
    <rect x="14" y="6" width="1" height="52" fill="#64748b"/>

    <!-- Flag Cloth (Git Commit / Octocat Vibe with Blue/Cyan) -->
    <g id="flag-cloth">
      <rect x="17" y="8" width="14" height="18" fill="#0284c7"/>
      <rect x="17" y="8" width="14" height="2" fill="#38bdf8"/>
      <rect x="17" y="24" width="14" height="2" fill="#0369a1"/>
      
      <!-- Flag Icon: Git Branch Node -->
      <circle cx="24" cy="14" r="2" fill="#ffffff"/>
      <line x1="24" y1="14" x2="24" y2="20" stroke="#ffffff" stroke-width="1"/>
      <circle cx="24" cy="20" r="1.5" fill="#38bdf8"/>
    </g>
  </g>
</svg>
