<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- 16-Bit Tech Coin / Developer Token -->
  <g>
    <!-- Border -->
    <rect x="4" y="0" width="8" height="16" fill="#0f172a"/>
    <rect x="2" y="1" width="12" height="14" fill="#0f172a"/>
    <rect x="1" y="2" width="14" height="12" fill="#0f172a"/>
    <rect x="0" y="4" width="16" height="8" fill="#0f172a"/>

    <!-- Gold & Blue Tech Shading -->
    <rect x="4" y="1" width="8" height="14" fill="#0284c7"/>
    <rect x="2" y="2" width="12" height="12" fill="#0ea5e9"/>
    <rect x="3" y="3" width="10" height="10" fill="#38bdf8"/>

    <!-- Inner Pixel Emblem ({ }) -->
    <rect x="5" y="5" width="2" height="6" fill="#0f172a"/>
    <rect x="7" y="5" width="2" height="2" fill="#0f172a"/>
    <rect x="7" y="9" width="2" height="2" fill="#0f172a"/>
    <rect x="9" y="5" width="2" height="6" fill="#0f172a"/>

    <!-- Sparkling Highlights -->
    <rect x="3" y="3" width="2" height="2" fill="#ffffff"/>
    <rect x="11" y="11" width="2" height="2" fill="#e0f2fe"/>
  </g>
</svg>
