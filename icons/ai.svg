<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- AI Neural Brain Pixel Art Icon -->
  <g>
    <rect x="2" y="2" width="28" height="28" fill="#0f172a"/>
    <rect x="4" y="4" width="24" height="24" fill="#0f172a"/>

    <!-- Neural Brain Network Outline -->
    <rect x="9" y="8" width="14" height="16" fill="#0284c7"/>
    <rect x="7" y="11" width="18" height="10" fill="#0284c7"/>

    <!-- Glowing Synapses Nodes -->
    <rect x="10" y="10" width="3" height="3" fill="#38bdf8"/>
    <rect x="19" y="10" width="3" height="3" fill="#38bdf8"/>
    <rect x="8" y="15" width="3" height="3" fill="#a855f7"/> <!-- Purple AI glow -->
    <rect x="21" y="15" width="3" height="3" fill="#a855f7"/>
    <rect x="14" y="13" width="4" height="4" fill="#ffffff"/> <!-- Central core -->
    <rect x="11" y="19" width="3" height="3" fill="#38bdf8"/>
    <rect x="18" y="19" width="3" height="3" fill="#38bdf8"/>

    <!-- Circuit Connection Lines -->
    <rect x="12" y="11" width="3" height="1" fill="#38bdf8"/>
    <rect x="17" y="11" width="3" height="1" fill="#38bdf8"/>
    <rect x="10" y="16" width="4" height="1" fill="#a855f7"/>
    <rect x="18" y="16" width="4" height="1" fill="#a855f7"/>
  </g>
</svg>
