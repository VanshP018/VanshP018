<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- Tux Linux Penguin Pixel Art Icon -->
  <g>
    <rect x="2" y="2" width="28" height="28" fill="#0f172a"/>
    <rect x="4" y="4" width="24" height="24" fill="#1e293b"/>

    <!-- Penguin Body -->
    <rect x="10" y="7" width="12" height="18" fill="#0f172a"/>
    <!-- White Belly -->
    <rect x="12" y="13" width="8" height="11" fill="#ffffff"/>
    
    <!-- Eyes & Beak -->
    <rect x="13" y="9" width="2" height="2" fill="#ffffff"/>
    <rect x="17" y="9" width="2" height="2" fill="#ffffff"/>
    <rect x="14" y="11" width="4" height="2" fill="#f59e0b"/>

    <!-- Yellow Feet -->
    <rect x="9" y="24" width="5" height="2" fill="#f59e0b"/>
    <rect x="18" y="24" width="5" height="2" fill="#f59e0b"/>
  </g>
</svg>
