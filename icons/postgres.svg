<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- PostgreSQL Elephant Pixel Art Icon -->
  <g>
    <rect x="2" y="2" width="28" height="28" fill="#0f172a"/>
    <rect x="4" y="4" width="24" height="24" fill="#1e293b"/>

    <!-- Elephant Body & Head -->
    <rect x="8" y="8" width="16" height="12" fill="#0284c7"/>
    <rect x="6" y="12" width="14" height="12" fill="#0369a1"/>
    <rect x="18" y="10" width="8" height="10" fill="#38bdf8"/>
    
    <!-- Trunk -->
    <rect x="24" y="16" width="3" height="8" fill="#38bdf8"/>
    <rect x="22" y="22" width="3" height="3" fill="#38bdf8"/>

    <!-- Eye & Ears -->
    <rect x="20" y="12" width="2" height="2" fill="#ffffff"/>
    <rect x="10" y="10" width="4" height="6" fill="#38bdf8"/>
  </g>
</svg>
