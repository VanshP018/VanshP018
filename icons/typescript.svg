<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- TypeScript Pixel Art Icon -->
  <g>
    <!-- Frame -->
    <rect x="2" y="2" width="28" height="28" fill="#0f172a"/>
    <rect x="4" y="4" width="24" height="24" fill="#0284c7"/>
    <rect x="4" y="4" width="24" height="2" fill="#38bdf8"/>

    <!-- 'TS' Pixel Text -->
    <!-- T -->
    <rect x="8" y="10" width="8" height="2" fill="#ffffff"/>
    <rect x="11" y="12" width="2" height="10" fill="#ffffff"/>
    
    <!-- S -->
    <rect x="18" y="10" width="7" height="2" fill="#ffffff"/>
    <rect x="18" y="12" width="2" height="4" fill="#ffffff"/>
    <rect x="18" y="15" width="7" height="2" fill="#ffffff"/>
    <rect x="23" y="17" width="2" height="4" fill="#ffffff"/>
    <rect x="18" y="20" width="7" height="2" fill="#ffffff"/>
  </g>
</svg>
